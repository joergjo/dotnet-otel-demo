name: dotnet-otel-demo

services:

  dice-roller:
    profiles:
      - all
    image: ${DICE_ROLLER_IMAGE:-joergjo/dice-roller:latest}
    build: ./DiceRoller
    ports:
      - "8080:8080"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4317
    depends_on:
      collector:
        condition: service_started
    restart: unless-stopped

  otel-lgtm:
    image: grafana/otel-lgtm
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped
