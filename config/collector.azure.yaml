receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:

extensions:
  azure_auth:
    service_principal:
      client_id: ${env:CLIENT_ID}
      tenant_id: ${env:TENANT_ID}
      client_secret: ${env:CLIENT_SECRET}
    scopes: [https://monitor.azure.com/.default]
  health_check:
    
exporters:
  otlp_http/azuremonitor:
    traces_endpoint: "${env:TRACES_ENDPOINT}"
    logs_endpoint: "${env:LOGS_ENDPOINT}"
    metrics_endpoint: "${env:METRICS_ENDPOINT}"
    auth:
      authenticator: azure_auth

service:
  telemetry:
    logs:
      level: debug
  extensions: [health_check, azure_auth]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/azuremonitor]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/azuremonitor]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/azuremonitor]
